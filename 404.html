  <!-- ==================== SYSTEM CONTROLLER JAVASCRIPT ==================== -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      
      // ==================== 1. DARK MODE MANAGER ====================
      const htmlEl = document.documentElement;
      const themeToggleBtn = document.getElementById("theme-toggle");

      // Check current theme settings on load
      const isDarkCached = localStorage.getItem("color-theme") === "dark" || 
        (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);

      if (isDarkCached) {
        htmlEl.classList.add("dark");
      } else {
        htmlEl.classList.remove("dark");
      }

      themeToggleBtn.addEventListener("click", function () {
        const isCurrentDark = htmlEl.classList.contains("dark");
        if (isCurrentDark) {
          htmlEl.classList.remove("dark");
          localStorage.setItem("color-theme", "light");
        } else {
          htmlEl.classList.add("dark");
          localStorage.setItem("color-theme", "dark");
        }
      });

      // ==================== 2. LTR/RTL DIRECTION CONTROLLER ====================
      const rtlToggleBtn = document.getElementById("rtl-toggle");

      // Check cache on load
      const isRtlCached = localStorage.getItem("direction") === "rtl";
      if (isRtlCached) {
        htmlEl.setAttribute("dir", "rtl");
      } else {
        htmlEl.setAttribute("dir", "ltr");
      }

      rtlToggleBtn.addEventListener("click", function () {
        const isCurrentRtl = htmlEl.getAttribute("dir") === "rtl";
        if (isCurrentRtl) {
          htmlEl.setAttribute("dir", "ltr");
          localStorage.setItem("direction", "ltr");
        } else {
          htmlEl.setAttribute("dir", "rtl");
          localStorage.setItem("direction", "rtl");
        }
      });

    });
  </script>
